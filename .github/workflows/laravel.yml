name: Laravel PHPStan, Swagger and Pest

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        php-versions: ['8.4', '8.5']
    services:
      mysql:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: badge
        ports:
          - 33306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
    - uses: actions/checkout@v4
    - name: Install Linux packages
      run: sudo apt update && sudo apt install -y --no-install-recommends python3-pip pyflakes3 git iverilog yosys arachne-pnr fpga-icestorm
    - name: Alias pyflakes
      run: sudo ln -sf /usr/bin/pyflakes3 /usr/local/bin/pyflakes
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: gd, gmp, zip, intl, exif, pcntl, mbstring, fileinfo, xdebug
        ini-values: "post_max_size=256M"
    - name: Check PHP Version
      run: php -v
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist && npm ci
    - name: Generate key
      run: php artisan key:generate
    - name: LaraStan
      run: vendor/bin/phpstan analyse
    - name: Security Check
      run: composer audit
    - name: Swagger generate
      run: php artisan l5-swagger:generate
    - name: Build assets
      run: npm run build
    - name: Populate DB
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 33306
        DB_DATABASE: badge
        DB_USERNAME: root
        DB_PASSWORD: root
      run: php artisan migrate --force --seed
    - name: Generate sitemap
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 33306
        DB_DATABASE: badge
        DB_USERNAME: root
        DB_PASSWORD: root
      run: php artisan sitemap:generate
    - name: Config clear
      run: php artisan config:clear
    - name: Route clear
      run: php artisan route:clear
    - name: Execute (Unit and Feature) tests via Pest
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 33306
        DB_DATABASE: badge
        DB_USERNAME: root
        DB_PASSWORD: root
        DB_TEST_DATABASE: badge
        DB_TEST_USERNAME: root
        DB_TEST_PASSWORD: root
      run: vendor/bin/pest

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: badge
        ports:
          - 33306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 33306
      DB_DATABASE: badge
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DOMAIN: 127.0.0.1
      SESSION_SECURE_COOKIE: false
      APP_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, gmp, zip, intl, exif, pcntl, mbstring, fileinfo
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist && npm ci
      - name: Generate key
        run: php artisan key:generate
      - name: Build assets
        run: npm run build
      - name: Populate DB
        run: php artisan migrate --force --seed && php artisan db:seed --class=E2eSeeder --force
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
